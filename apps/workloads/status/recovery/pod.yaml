apiVersion: v1
kind: Pod
metadata:
  name: status-history-recovery
  namespace: status
  labels:
    app.kubernetes.io/name: status-history-recovery
spec:
  # Operator-only helper, outside the chart and GitOps reconciliation.
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    fsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: status
              app.kubernetes.io/instance: status
          topologyKey: kubernetes.io/hostname
  containers:
    - name: recovery
      image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
      imagePullPolicy: IfNotPresent
      command: [python3, -c, "import time; time.sleep(1800)"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: status-data
