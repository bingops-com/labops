apiVersion: v1
kind: ConfigMap
metadata:
  name: rom-config-init
  namespace: rom
data:
  init.py: |
    import base64
    import hashlib
    import os
    from pathlib import Path
    from xml.sax.saxutils import escape

    password = os.environ["STACK_PASSWORD"]

    prowlarr = Path("/data/configs/prowlarr")
    prowlarr.mkdir(parents=True, exist_ok=True)
    prowlarr_config = prowlarr / "config.xml"
    if not prowlarr_config.exists():
        prowlarr_config.write_text(
            "<Config>"
            "<BindAddress>*</BindAddress><Port>9696</Port>"
            "<EnableSsl>False</EnableSsl><LaunchBrowser>False</LaunchBrowser>"
            f"<ApiKey>{escape(password)}</ApiKey>"
            "<AuthenticationMethod>External</AuthenticationMethod>"
            "<AuthenticationRequired>Enabled</AuthenticationRequired>"
            "<Branch>master</Branch><LogLevel>info</LogLevel>"
            "<UrlBase></UrlBase><InstanceName>Prowlarr</InstanceName>"
            "<UpdateMechanism>Docker</UpdateMechanism></Config>\n",
            encoding="utf-8",
        )

    qbittorrent = Path("/data/configs/qbittorrent/qBittorrent")
    qbittorrent.mkdir(parents=True, exist_ok=True)
    qbittorrent_config = qbittorrent / "qBittorrent.conf"
    if not qbittorrent_config.exists():
        salt = os.urandom(16)
        digest = hashlib.pbkdf2_hmac("sha512", password.encode(), salt, 100_000)
        encoded = f"{base64.b64encode(salt).decode()}:{base64.b64encode(digest).decode()}"
        qbittorrent_config.write_text(
            "[LegalNotice]\nAccepted=true\n\n[Preferences]\n"
            "WebUI\\Address=*\nWebUI\\Port=8080\n"
            "WebUI\\Username=bingops\n"
            f"WebUI\\Password_PBKDF2=\"@ByteArray({encoded})\"\n"
            "WebUI\\HostHeaderValidation=false\nWebUI\\CSRFProtection=true\n",
            encoding="utf-8",
        )

    managed_paths = (
        "/data/configs/romarr",
        "/data/downloads",
        "/data/library/roms",
        "/data/resources",
        "/data/assets",
        "/data/config",
    )
    for path in managed_paths:
        Path(path).mkdir(parents=True, exist_ok=True)
    for path in managed_paths + (str(prowlarr_config), str(qbittorrent_config)):
        stat = os.stat(path)
        if stat.st_uid != 1000 or stat.st_gid != 1000:
            os.chown(path, 1000, 1000)
        if os.path.isdir(path):
            os.chmod(path, 0o775)
