apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-valkey
  namespace: rom
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  # One cache instance; replace it before RomM starts its metadata import.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine
          imagePullPolicy: IfNotPresent
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 200m
              # LaunchBox imports hundreds of thousands of metadata entries.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: romm-valkey
  namespace: rom
spec:
  selector:
    app.kubernetes.io/name: romm-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
