apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-valkey
  namespace: rom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: romm-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine
          imagePullPolicy: IfNotPresent
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: romm-valkey
  namespace: rom
spec:
  selector:
    app.kubernetes.io/name: romm-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
