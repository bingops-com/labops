apiVersion: v1
kind: ConfigMap
metadata:
  name: rom-metadata-bootstrap
  namespace: rom
data:
  bootstrap.py: |
    import json
    import os
    import time
    import urllib.error
    import urllib.request

    from redis import Redis
    from rq import Queue
    from rq.exceptions import DuplicateJobError
    from rq.job import JobStatus

    # Match the low-priority queue and bootstrap job ID in RomM 5.3.1.
    queue = Queue("low", connection=Redis(host=os.environ["REDIS_HOST"], db=0))
    job_id = "update_launchbox_metadata_bootstrap"
    active = {JobStatus.QUEUED, JobStatus.STARTED, JobStatus.DEFERRED, JobStatus.SCHEDULED}

    def ready():
        try:
            with urllib.request.urlopen(
                "http://romm/api/heartbeat/metadata/launchbox", timeout=15
            ) as response:
                return json.load(response) is True
        except (OSError, urllib.error.URLError):
            return False

    if ready():
        print("LaunchBox metadata already ready", flush=True)
    else:
        job = queue.fetch_job(job_id)
        if job is None or job.get_status(refresh=True) not in active:
            # A failed or completed attempt with an empty cache may be retried.
            if job is not None:
                job.delete()
            try:
                queue.enqueue(
                    "tasks.tasks.run_task_by_name",
                    kwargs={"name": "update_launchbox_metadata", "task_kwargs": {}},
                    job_id=job_id,
                    unique=True,
                    job_timeout=1800,
                    result_ttl=86400,
                    meta={
                        "task_key": "update_launchbox_metadata",
                        "task_name": "Scheduled LaunchBox metadata update",
                        "task_type": "update",
                    },
                )
                print("Queued LaunchBox metadata import", flush=True)
            except DuplicateJobError:
                print("LaunchBox metadata import already queued", flush=True)
        else:
            print("Waiting for existing LaunchBox metadata import", flush=True)

        deadline = time.monotonic() + 2100
        while not ready():
            job = queue.fetch_job(job_id)
            if job is not None and job.get_status(refresh=True) == JobStatus.FAILED:
                raise RuntimeError("LaunchBox metadata import failed; retry the bootstrap")
            if time.monotonic() >= deadline:
                raise RuntimeError("LaunchBox metadata did not become ready within 35 minutes")
            time.sleep(15)
        print("LaunchBox metadata ready", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rom-metadata-bootstrap
  namespace: rom
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rom-metadata-bootstrap
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: rommapp/romm:5.3.1
          imagePullPolicy: IfNotPresent
          command: ["/src/.venv/bin/python3", "/scripts/bootstrap.py"]
          env:
            - { name: REDIS_HOST, value: romm-valkey }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: rom-metadata-bootstrap }
