apiVersion: batch/v1
kind: CronJob
metadata:
  name: rom-files-r2-backup
  namespace: rom
spec:
  schedule: "0 15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - rclone sync /data r2:bingops-cnpg-labprod/rom-files/current --backup-dir "r2:bingops-cnpg-labprod/rom-files/archive/$(date -u +%Y-%m-%dT%H-%M-%SZ)" --checkers 8 --transfers 4; rclone delete r2:bingops-cnpg-labprod/rom-files/archive --min-age 30d --rmdirs
              env:
                - { name: RCLONE_CONFIG_R2_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_R2_PROVIDER, value: Cloudflare }
                - { name: RCLONE_CONFIG_R2_ENDPOINT, value: https://4d31056d6b4bf143606ff3ca757e0b8c.r2.cloudflarestorage.com }
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: rom-r2-credentials, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: rom-r2-credentials, key: ACCESS_SECRET_KEY } }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: rom-data }
            - name: tmp
              emptyDir: {}
