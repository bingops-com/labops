apiVersion: v1
kind: ConfigMap
metadata:
  name: rom-request-portal
  namespace: rom
data:
  server.py: |
    import json
    import os
    import re
    import secrets
    import shutil
    import threading
    from concurrent.futures import ThreadPoolExecutor
    from http import HTTPStatus
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path
    from urllib.parse import parse_qs, urlparse

    from rom_hub.backends import IMPORT
    from rom_hub.broker.fetcher import HttpxFetcher
    from rom_hub.broker.host import PluginProcess
    from rom_hub.cli import (
        default_root,
        downloads_dir,
        jobs_db_path,
        prepare_assets,
        prepare_secrets,
    )
    from rom_hub.dispatcher import search_all
    from rom_hub.importer import run_import
    from rom_hub.jobs import JobQueue
    from rom_hub.registry import Registry

    INDEX = Path(os.environ.get("PORTAL_INDEX", "/portal/index.html")).read_bytes()
    HUB_ROOT = default_root()
    LIBRARY_ROOT = Path(os.environ.get("LIBRARY_PATH", "/roms"))
    MAX_BODY = 4096
    MAX_CANDIDATES = 256
    CANDIDATES = {}
    CANDIDATE_ORDER = []
    CANDIDATE_LOCK = threading.Lock()
    IMPORT_POOL = ThreadPoolExecutor(max_workers=2)


    class FolderBackend:
        name = "Folder"

        def capabilities(self):
            return frozenset({IMPORT})

        def authenticate(self):
            if not LIBRARY_ROOT.is_dir():
                raise RuntimeError("the shared ROM library is unavailable")

        def platform_id(self, platform):
            slug = str(platform or "").strip().lower()
            if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", slug):
                raise ValueError("invalid platform slug")
            return slug

        def list_roms(self, platform_id):
            directory = LIBRARY_ROOT / platform_id
            if not directory.exists():
                return []
            return [
                {"id": index, "fs_name": path.name}
                for index, path in enumerate(sorted(directory.iterdir()), start=1)
                if path.is_file() and not path.name.startswith(".import-")
            ]

        def upload_rom(self, path, platform_id):
            directory = LIBRARY_ROOT / platform_id
            directory.mkdir(parents=True, exist_ok=True)
            destination = directory / path.name
            if destination.exists():
                raise FileExistsError("the destination already exists")
            temporary = directory / f".import-{secrets.token_hex(12)}"
            try:
                with path.open("rb") as source, temporary.open("xb") as target:
                    shutil.copyfileobj(source, target, length=1024 * 1024)
                os.link(temporary, destination)
            finally:
                temporary.unlink(missing_ok=True)

        def scan_platform(self, platform_id):
            return None


    def platform_directory():
        platforms = set()
        for plugin in Registry(HUB_ROOT).installed():
            if plugin.enabled and "search" in plugin.manifest.capabilities:
                platforms.update(plugin.manifest.platforms or [])
        return [{"slug": slug, "name": slug.upper()} for slug in sorted(platforms)]


    def search_catalog(game, platform):
        plugins = Registry(HUB_ROOT).installed()
        fetcher = HttpxFetcher()
        try:
            outcome = search_all(
                plugins,
                fetcher=fetcher,
                query=game,
                platform=platform or None,
                limit=50,
                allow_unsandboxed=False,
                assets_for=lambda plugin: prepare_assets(plugin, HUB_ROOT),
                secrets_for=lambda plugin: prepare_secrets(plugin, HUB_ROOT),
            )
        finally:
            fetcher.close()

        importers = {
            plugin.slug
            for plugin in plugins
            if plugin.enabled and "importer" in plugin.manifest.capabilities
        }
        items = []
        with CANDIDATE_LOCK:
            for result in outcome.results:
                if result.plugin not in importers:
                    continue
                candidate_id = secrets.token_urlsafe(24)
                CANDIDATES[candidate_id] = result
                CANDIDATE_ORDER.append(candidate_id)
                items.append(
                    {
                        "id": candidate_id,
                        "title": result.title,
                        "size": result.size_bytes or 0,
                        "seeders": 0,
                        "indexer": result.plugin,
                        "score": 100,
                        "reasons": ["homebrew/freeware source"],
                        "grabbable": True,
                    }
                )
            while len(CANDIDATE_ORDER) > MAX_CANDIDATES:
                CANDIDATES.pop(CANDIDATE_ORDER.pop(0), None)
        return {
            "items": items,
            "sources": outcome.responded,
            "sources_total": outcome.total,
        }


    def import_candidate(result):
        try:
            plugin = Registry(HUB_ROOT).get(result.plugin)
            if not plugin.enabled or "importer" not in plugin.manifest.capabilities:
                raise RuntimeError("the source is no longer enabled for import")
            backend = FolderBackend()
            backend.authenticate()
            fetcher = HttpxFetcher()
            try:
                with (
                    JobQueue(jobs_db_path(HUB_ROOT)) as queue,
                    PluginProcess(
                        plugin_dir=plugin.path,
                        manifest=plugin.manifest,
                        config=plugin.config,
                        fetcher=fetcher,
                        timeout=60,
                        allow_unsandboxed=False,
                        data_assets=prepare_assets(plugin, HUB_ROOT),
                        secrets=prepare_secrets(plugin, HUB_ROOT),
                    ) as process,
                ):
                    outcome = run_import(
                        process,
                        result,
                        backend=backend,
                        queue=queue,
                        download_dir=downloads_dir(HUB_ROOT),
                        warn_unplayable=False,
                    )
                print(f"ROM Hub import finished with state {outcome.state.value}", flush=True)
            finally:
                fetcher.close()
        except Exception as error:
            print(f"ROM Hub import failed: {type(error).__name__}", flush=True)


    class PortalHandler(BaseHTTPRequestHandler):
        server_version = "LabOpsROMRequest/1"

        def _headers(self, status, content_type, length):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(length))
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Security-Policy", "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'")
            self.send_header("Referrer-Policy", "no-referrer")
            self.send_header("X-Content-Type-Options", "nosniff")
            self.send_header("X-Frame-Options", "DENY")
            self.end_headers()

        def _send(self, status, body, content_type="application/json; charset=utf-8"):
            raw = body if isinstance(body, bytes) else json.dumps(body).encode()
            self._headers(status, content_type, len(raw))
            self.wfile.write(raw)

        def do_GET(self):
            route = urlparse(self.path)
            if route.path == "/healthz":
                ok = HUB_ROOT.is_dir() and LIBRARY_ROOT.is_dir()
                return self._send(HTTPStatus.OK if ok else HTTPStatus.SERVICE_UNAVAILABLE, {"ok": ok})
            if route.path == "/":
                return self._send(HTTPStatus.OK, INDEX, "text/html; charset=utf-8")
            if route.path == "/api/platforms":
                return self._send(HTTPStatus.OK, platform_directory())
            if route.path == "/api/releases":
                query = parse_qs(route.query)
                game = (query.get("game") or [""])[0].strip()
                platform = (query.get("platform") or [""])[0].strip()
                if not game or len(game) > 160 or len(platform) > 80:
                    return self._send(HTTPStatus.BAD_REQUEST, {"error": "invalid search"})
                try:
                    return self._send(HTTPStatus.OK, search_catalog(game, platform))
                except Exception as error:
                    print(f"ROM Hub search failed: {type(error).__name__}", flush=True)
                    return self._send(HTTPStatus.BAD_GATEWAY, {"error": "catalog search failed"})
            return self._send(HTTPStatus.NOT_FOUND, {"error": "not found"})

        def do_POST(self):
            route = urlparse(self.path)
            if route.path != "/api/grab":
                return self._send(HTTPStatus.NOT_FOUND, {"error": "not found"})
            if self.headers.get_content_type() != "application/json":
                return self._send(HTTPStatus.UNSUPPORTED_MEDIA_TYPE, {"error": "JSON required"})
            try:
                length = int(self.headers.get("Content-Length", "0"))
            except ValueError:
                length = 0
            if length <= 0 or length > MAX_BODY:
                return self._send(HTTPStatus.BAD_REQUEST, {"error": "invalid request"})
            try:
                body = json.loads(self.rfile.read(length))
            except (json.JSONDecodeError, UnicodeDecodeError):
                return self._send(HTTPStatus.BAD_REQUEST, {"error": "invalid JSON"})
            release_id = str(body.get("id", "")).strip() if isinstance(body, dict) else ""
            if not release_id or len(release_id) > 256:
                return self._send(HTTPStatus.BAD_REQUEST, {"error": "invalid release"})
            with CANDIDATE_LOCK:
                result = CANDIDATES.pop(release_id, None)
                if release_id in CANDIDATE_ORDER:
                    CANDIDATE_ORDER.remove(release_id)
            if result is None:
                return self._send(HTTPStatus.GONE, {"error": "search result expired"})
            IMPORT_POOL.submit(import_candidate, result)
            return self._send(HTTPStatus.ACCEPTED, {"ok": True, "queued": True})

        def log_message(self, pattern, *args):
            print(f'{self.client_address[0]} {self.command} {urlparse(self.path).path}', flush=True)


    if __name__ == "__main__":
        port = int(os.environ.get("PORTAL_PORT", "8080"))
        ThreadingHTTPServer(("0.0.0.0", port), PortalHandler).serve_forever()
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Demandes de jeux · lab.bingo</title>
      <style>
        :root{--surface:#fff;--ink:#111730;--soft:#586079;--line:#d8ddea;--field:#8690a3;--blue:#1443d6;--blue-hover:#0f36b3;--deep:#0a2480;--mint:#8af2bf;font-family:"RedHatText",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f5f7fc;color-scheme:light}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,rgba(20,67,214,.05),transparent 42%),#f5f7fc}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.62}
        .shell{min-height:100vh;display:grid;grid-template-columns:minmax(18rem,31rem) minmax(0,1fr)}
        .mast{position:relative;overflow:hidden;padding:clamp(2rem,5vw,5.5rem);background:linear-gradient(155deg,var(--blue),var(--deep));color:white;display:flex;flex-direction:column;justify-content:space-between;gap:4rem}
        .mast:after{content:"";position:absolute;width:34rem;height:34rem;right:-16rem;bottom:-16rem;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 5rem rgba(255,255,255,.035),0 0 0 10rem rgba(255,255,255,.025)}
        .brand{position:relative;z-index:1;display:flex;align-items:center;gap:.8rem;font-family:"RedHatDisplay",ui-sans-serif,system-ui,sans-serif;font-weight:900;font-size:1.1rem}.mark{display:grid;place-items:center;width:2.45rem;height:2.45rem;border-radius:.72rem;background:white;color:var(--blue);font-size:1.35rem}.mark:after{content:"";width:.42rem;height:.42rem;border-radius:50%;background:var(--mint);position:absolute;margin:1.55rem 0 0 1.55rem}
        .intro{position:relative;z-index:1;max-width:29rem}.intro h1{font-family:"RedHatDisplay",ui-sans-serif,system-ui,sans-serif;font-size:clamp(2.7rem,6vw,5.6rem);line-height:.94;letter-spacing:-.055em;margin:0 0 1.5rem}.intro p{font-size:1.08rem;line-height:1.65;margin:0;color:rgba(255,255,255,.84)}
        .compass{position:relative;z-index:1;width:5rem;height:5rem;border:1px solid rgba(255,255,255,.4);border-radius:50%;display:grid;place-items:center}.compass:before{content:"";width:1.1rem;height:3.7rem;background:linear-gradient(to bottom,var(--mint) 0 48%,white 48%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(24deg)}
        main{padding:clamp(1.5rem,5vw,5rem);display:flex;align-items:flex-start}.workspace{width:min(100%,70rem);margin:auto}.toolbar{display:flex;justify-content:flex-end;margin-bottom:1.3rem}.lang{border:0;background:transparent;color:var(--soft);padding:.55rem}.lang[aria-pressed="true"]{color:var(--blue);font-weight:700}
        .search{background:var(--surface);border-radius:1rem;padding:clamp(1.4rem,3vw,2.5rem);box-shadow:0 1.4rem 4rem rgba(17,23,48,.09)}.search h2{font-family:"RedHatDisplay",ui-sans-serif,system-ui,sans-serif;font-size:clamp(1.7rem,3vw,2.4rem);letter-spacing:-.035em;margin:0 0 .5rem}.lead{color:var(--soft);line-height:1.55;margin:0 0 1.8rem;max-width:48rem}.form{display:grid;grid-template-columns:minmax(12rem,1.5fr) minmax(11rem,1fr) auto;gap:.85rem;align-items:end}.field label{display:block;font-weight:700;margin:0 0 .45rem}.field input,.field select{width:100%;height:3rem;border:1px solid var(--field);border-radius:.625rem;background:white;color:var(--ink);padding:0 .9rem}.primary{height:3rem;border:0;border-radius:.625rem;background:var(--blue);color:white;font-weight:800;padding:0 1.4rem}.primary:hover{background:var(--blue-hover)}:focus-visible{outline:3px solid rgba(20,67,214,.28);outline-offset:2px}
        #status{min-height:1.6rem;margin:1rem 0 0;color:var(--soft)}#status.error{color:#9d2430}.results{margin-top:1.5rem;display:grid;gap:.75rem}.release{display:grid;grid-template-columns:5rem minmax(0,1fr) auto;gap:1rem;align-items:center;background:white;border:1px solid var(--line);border-radius:.75rem;padding:1rem 1.1rem}.score{font-family:"RedHatDisplay",ui-sans-serif,system-ui,sans-serif;font-weight:900;color:var(--blue);font-size:1.3rem}.release h3{font-size:1rem;margin:0 0 .35rem;overflow-wrap:anywhere}.meta{color:var(--soft);font-size:.86rem;line-height:1.5}.why{margin-top:.35rem;color:var(--soft);font-size:.82rem}.grab{border:1px solid var(--blue);border-radius:.625rem;background:white;color:var(--blue);font-weight:800;padding:.7rem 1rem}.grab:hover{background:#eef2ff}.grab.done{border-color:var(--mint);background:#eafff3;color:#125f3a}.empty{border:1px dashed var(--field);border-radius:.75rem;padding:2rem;text-align:center;color:var(--soft)}.legal{margin:1.2rem 0 0;color:var(--soft);font-size:.78rem;line-height:1.5}
        @media(max-width:850px){.shell{grid-template-columns:1fr}.mast{min-height:16rem;padding:1.6rem 1.5rem;gap:2rem}.intro h1{font-size:2.8rem;margin-bottom:.8rem}.compass{display:none}main{padding:1.2rem}.form{grid-template-columns:1fr}.primary{width:100%}.release{grid-template-columns:3.5rem minmax(0,1fr)}.release .grab{grid-column:1/-1;width:100%}}
        @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
      </style>
    </head>
    <body>
      <div class="shell">
        <aside class="mast">
          <div class="brand"><span class="mark">L</span><span>lab.bingo</span></div>
          <div class="intro"><h1 data-i18n="hero">Trouvez votre prochain jeu.</h1><p data-i18n="heroText">Recherchez une version disponible, choisissez-la, puis retrouvez-la automatiquement dans RomM après son import.</p></div>
          <div class="compass" aria-hidden="true"></div>
        </aside>
        <main>
          <div class="workspace">
            <div class="toolbar" aria-label="Language"><button class="lang" data-lang="fr" aria-pressed="true">FR</button><button class="lang" data-lang="en" aria-pressed="false">EN</button></div>
            <section class="search">
              <h2 data-i18n="title">Demander un jeu</h2>
              <p class="lead" data-i18n="lead">La recherche consulte les sources configurées par l’administrateur. Les réglages et les identifiants restent privés.</p>
              <form class="form" id="search-form">
                <div class="field"><label for="game" data-i18n="game">Jeu</label><input id="game" name="game" maxlength="160" required autocomplete="off" placeholder="Phantasy Star IV"></div>
                <div class="field"><label for="platform" data-i18n="platform">Plateforme</label><select id="platform" name="platform"><option value="" data-i18n="anyPlatform">Toutes les plateformes</option></select></div>
                <button class="primary" type="submit" data-i18n="search">Rechercher</button>
              </form>
              <p id="status" role="status" aria-live="polite"></p>
              <div id="results" class="results"></div>
              <p class="legal" data-i18n="legal">Téléchargez uniquement des contenus que vous avez le droit d’utiliser ou qui sont librement distribuables.</p>
            </section>
          </div>
        </main>
      </div>
      <script>
        const copy={fr:{hero:"Trouvez votre prochain jeu.",heroText:"Recherchez une version disponible, choisissez-la, puis retrouvez-la automatiquement dans RomM après son import.",title:"Demander un jeu",lead:"La recherche consulte les sources configurées par l’administrateur. Les réglages et les identifiants restent privés.",game:"Jeu",platform:"Plateforme",anyPlatform:"Toutes les plateformes",search:"Rechercher",searching:"Recherche en cours…",none:"Aucune version disponible pour cette recherche.",found:n=>`${n} version${n>1?'s':''} trouvée${n>1?'s':''}.`,grab:"Télécharger",grabbing:"Envoi…",done:"Téléchargement lancé",failed:"La demande n’a pas pu être envoyée.",unavailable:"Le service de demandes est momentanément indisponible.",legal:"Téléchargez uniquement des contenus que vous avez le droit d’utiliser ou qui sont librement distribuables.",seeders:"sources",size:"Taille"},en:{hero:"Find your next game.",heroText:"Search the available releases, choose one, then find it automatically in RomM after import.",title:"Request a game",lead:"Search uses sources configured by the administrator. Settings and credentials stay private.",game:"Game",platform:"Platform",anyPlatform:"Any platform",search:"Search",searching:"Searching…",none:"No release is available for this search.",found:n=>`${n} release${n===1?'':'s'} found.`,grab:"Download",grabbing:"Sending…",done:"Download queued",failed:"The request could not be sent.",unavailable:"The request service is temporarily unavailable.",legal:"Only download content you are entitled to use or that is freely distributable.",seeders:"sources",size:"Size"}};
        let language=(navigator.language||'fr').toLowerCase().startsWith('fr')?'fr':'en';let last=[];
        const t=key=>copy[language][key];const status=document.querySelector('#status');const results=document.querySelector('#results');
        function setLanguage(next){language=next;document.documentElement.lang=next;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('.lang').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===next)));render(last)}
        function bytes(value){if(!value)return '—';const units=['B','KB','MB','GB','TB'];let n=Number(value),i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return `${n.toFixed(i>1?1:0)} ${units[i]}`}
        function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
        function render(items){last=items;results.replaceChildren();for(const item of items){const row=element('article','release');row.append(element('div','score',String(item.score??'—')));const body=element('div');body.append(element('h3','',item.title||'—'));body.append(element('div','meta',`${t('size')}: ${bytes(item.size)} · ${item.seeders??0} ${t('seeders')} · ${item.indexer||'—'}`));if(Array.isArray(item.reasons)&&item.reasons.length)body.append(element('div','why',item.reasons.join(' · ')));row.append(body);const button=element('button','grab',t('grab'));button.type='button';button.disabled=!item.grabbable;button.addEventListener('click',()=>grab(item,button));row.append(button);results.append(row)}}
        async function grab(item,button){button.disabled=true;button.textContent=t('grabbing');try{const response=await fetch('/api/grab',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'failed');button.classList.add('done');button.textContent=t('done');status.className='';status.textContent=t('done')}catch(error){button.disabled=false;button.textContent=t('grab');status.className='error';status.textContent=error.message||t('failed')}}
        document.querySelectorAll('.lang').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));
        document.querySelector('#search-form').addEventListener('submit',async event=>{event.preventDefault();results.replaceChildren();status.className='';status.textContent=t('searching');const params=new URLSearchParams(new FormData(event.currentTarget));try{const response=await fetch('/api/releases?'+params);const data=await response.json();if(!response.ok||data.error)throw new Error(data.error||'failed');render(data.items||[]);status.textContent=data.items?.length?t('found')(data.items.length):t('none')}catch(error){status.className='error';status.textContent=error.message||t('unavailable')}});
        fetch('/api/platforms').then(response=>response.json()).then(items=>{const select=document.querySelector('#platform');for(const item of items){const option=document.createElement('option');option.value=item.slug;option.textContent=item.name;select.append(option)}}).catch(()=>{});setLanguage(language);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rom-request-portal
  namespace: rom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: rom-request-portal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rom-request-portal }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: portal
          image: ghcr.io/blizzhacker/romarr:0.9.0
          imagePullPolicy: IfNotPresent
          command: ["python", "/portal/server.py"]
          env:
            - { name: HOME, value: /tmp }
            - { name: LIBRARY_PATH, value: /roms }
            - { name: PYTHONPATH, value: /app }
            - { name: ROM_HUB_HOME, value: /config/rom-hub }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: app, mountPath: /portal, readOnly: true }
            - { name: data, mountPath: /config, subPath: configs/romarr }
            - { name: data, mountPath: /roms, subPath: library/roms }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app
          configMap: { name: rom-request-portal }
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim: { claimName: rom-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rom-request-portal
  namespace: rom
spec:
  selector: { app.kubernetes.io/name: rom-request-portal }
  ports:
    - { name: http, port: 8080, targetPort: http }
