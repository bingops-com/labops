apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - bitwarden-token-sync.yaml
  - r2-secret.yaml
  - screenscraper-secret.yaml

labels:
  - pairs:
      environment: labprod

patches:
  - target:
      kind: Deployment
      name: romm
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: romm
      spec:
        template:
          metadata:
            annotations:
              labops.bingo/screenscraper-credentials-revision: "1"
          spec:
            containers:
              - name: romm
                env:
                  - name: SCREENSCRAPER_USER
                    valueFrom:
                      secretKeyRef:
                        name: rom-screenscraper-credentials
                        key: SCREENSCRAPER_USER
                  - name: SCREENSCRAPER_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: rom-screenscraper-credentials
                        key: SCREENSCRAPER_PASSWORD
  - target:
      kind: Namespace
      name: rom
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: Ingress
      name: romm
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: rom.lab.bingo
      - op: replace
        path: /spec/tls/0/hosts/0
        value: rom.lab.bingo
