apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitwarden-token-sync
  namespace: rom
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rom-bitwarden-token-source
  namespace: argocd-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bw-auth-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rom-bitwarden-token-source
  namespace: argocd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rom-bitwarden-token-source
subjects:
  - kind: ServiceAccount
    name: bitwarden-token-sync
    namespace: rom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bitwarden-token-sync-target
  namespace: rom
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bw-auth-token"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bitwarden-token-sync-target
  namespace: rom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bitwarden-token-sync-target
subjects:
  - kind: ServiceAccount
    name: bitwarden-token-sync
    namespace: rom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bitwarden-token-sync
  namespace: rom
data:
  sync.py: |
    import json
    import ssl
    import urllib.error
    import urllib.request

    api = "https://kubernetes.default.svc"
    ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    source = "/api/v1/namespaces/argocd-system/secrets/bw-auth-token"
    target = "/api/v1/namespaces/rom/secrets/bw-auth-token"
    collection = "/api/v1/namespaces/rom/secrets"

    with open(token_path, encoding="utf-8") as token_file:
        bearer = token_file.read().strip()
    context = ssl.create_default_context(cafile=ca)

    def request(path, method="GET", payload=None, content_type="application/json"):
        body = None if payload is None else json.dumps(payload).encode()
        req = urllib.request.Request(api + path, data=body, method=method, headers={"Authorization": f"Bearer {bearer}", "Content-Type": content_type})
        with urllib.request.urlopen(req, context=context, timeout=30) as response:
            return json.load(response)

    encoded_token = request(source).get("data", {}).get("token")
    if not encoded_token:
        raise RuntimeError("source Secret does not contain the token key")
    try:
        request(target, "PATCH", {"data": {"token": encoded_token}}, "application/merge-patch+json")
        action = "updated"
    except urllib.error.HTTPError as error:
        if error.code != 404:
            raise
        request(collection, "POST", {"apiVersion": "v1", "kind": "Secret", "metadata": {"name": "bw-auth-token", "namespace": "rom"}, "type": "Opaque", "data": {"token": encoded_token}})
        action = "created"
    print(f"{action} rom/bw-auth-token")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitwarden-token-sync
  namespace: rom
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: bitwarden-token-sync
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              image: python:3.13.7-alpine3.22
              command: ["python", "/scripts/sync.py"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 10m, memory: 24Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - { name: script, mountPath: /scripts, readOnly: true }
          volumes:
            - name: script
              configMap: { name: bitwarden-token-sync }
