# Disposable restore copies, never source primaries. Operator action only.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: arcade-games-restore
  namespace: games
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  instances: 1
  bootstrap:
    recovery:
      source: games-source
      database: games
      owner: games
  externalClusters:
    - name: games-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: games-postgresql
          serverName: games-postgresql-g1
  storage: {size: 4Gi, storageClass: local-path}
---
