apiVersion: v1
kind: ServiceAccount
metadata:
  name: arcade-credentials-sync
  namespace: games
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arcade-credentials-source
  namespace: games
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [arcade-postgresql-app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arcade-credentials-source
  namespace: games
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: arcade-credentials-source}
subjects:
  - {kind: ServiceAccount, name: arcade-credentials-sync, namespace: games}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arcade-credentials-target
  namespace: slots
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [arcade-database]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arcade-credentials-target
  namespace: slots
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: arcade-credentials-target}
subjects:
  - {kind: ServiceAccount, name: arcade-credentials-sync, namespace: games}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arcade-credentials-sync
  namespace: games
data:
  sync.py: |
    import base64
    import json
    import ssl
    import urllib.error
    import urllib.parse
    import urllib.request

    api = "https://kubernetes.default.svc"
    with open("/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8") as file:
        token = file.read().strip()
    context = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

    def request(path, method="GET", payload=None, content_type="application/json"):
        body = None if payload is None else json.dumps(payload).encode()
        req = urllib.request.Request(api + path, data=body, method=method, headers={"Authorization": "Bearer " + token, "Content-Type": content_type})
        with urllib.request.urlopen(req, context=context, timeout=30) as response:
            return json.load(response)

    source = request("/api/v1/namespaces/games/secrets/arcade-postgresql-app")
    uri = urllib.parse.urlsplit(base64.b64decode(source["data"]["uri"], validate=True).decode())
    if uri.scheme not in ("postgres", "postgresql") or uri.hostname not in ("arcade-postgresql-rw", "arcade-postgresql-rw.games", "arcade-postgresql-rw.games.svc", "arcade-postgresql-rw.games.svc.cluster.local") or uri.path != "/arcade" or uri.username != "arcade":
        raise RuntimeError("Unexpected CNPG endpoint; no credential copied")
    # CNPG may emit a namespace-relative hostname: normalize before copying.
    authority = uri.netloc.rsplit("@", 1)[0] + "@arcade-postgresql-rw.games.svc.cluster.local:5432"
    normalized = urllib.parse.urlunsplit(uri._replace(netloc=authority))
    encoded = base64.b64encode(normalized.encode()).decode()

    def reconcile(namespace):
        path = f"/api/v1/namespaces/{namespace}/secrets/arcade-database"
        try:
            request(path, "PATCH", {"data": {"uri": encoded}}, "application/merge-patch+json")
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
            request(f"/api/v1/namespaces/{namespace}/secrets", "POST", {"apiVersion": "v1", "kind": "Secret", "metadata": {"name": "arcade-database", "namespace": namespace}, "type": "Opaque", "data": {"uri": encoded}})
        print(f"Reconciled {namespace}/arcade-database")

    reconcile("slots")

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arcade-credentials-sync
  namespace: games
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: arcade-credentials-sync
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: sync
              image: python:3.13.7-alpine3.22
              command: [python, /scripts/sync.py]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
              resources:
                requests: {cpu: 10m, memory: 24Mi}
                limits: {cpu: 100m, memory: 64Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: script
              configMap: {name: arcade-credentials-sync}
