apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: arcade-postgresql-daily
  namespace: games
spec:
  schedule: "0 45 3 * * *"
  backupOwnerReference: self
  cluster: {name: arcade-postgresql}
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arcade-postgresql
  namespace: games
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: arcade-postgresql
  podMetricsEndpoints:
    - port: metrics
