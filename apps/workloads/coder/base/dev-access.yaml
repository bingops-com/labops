---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder-dev
  namespace: coder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: coder-coder-private@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: dev.lab.bingo
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder-dev-portal
                port: {name: http}
    - host: '*.dev.lab.bingo'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port: {name: http}
  tls:
    - hosts: [dev.lab.bingo, '*.dev.lab.bingo']
      secretName: coder-dev-tls
