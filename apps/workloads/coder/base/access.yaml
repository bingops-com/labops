---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-private
  namespace: coder
spec:
  ipAllowList:
    sourceRange:
      - 192.168.10.0/24
      - 100.64.0.0/10
      # The workspace agents and provisioner use this private ingress too.
      - 10.240.0.0/16
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder
  namespace: coder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: coder-coder-private@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: coder.lab.bingo
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port: {name: http}
  tls:
    - hosts: [coder.lab.bingo]
      secretName: coder-tls
