---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - postgresql.yaml
  - server.yaml
  - access.yaml
  - workspace.yaml
  - dev-access.yaml
  - backup.yaml
  - bootstrap.yaml
configMapGenerator:
  - name: coder-bootstrap-script
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - bootstrap.py
  - name: coder-lab-template
    namespace: coder
    options:
      disableNameSuffixHash: true
    files:
      - main.tf=template/main.tf
      - startup.sh=template/startup.sh
      - .terraform.lock.hcl=template/.terraform.lock.hcl
  - name: coder-lab-template
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - main.tf=template/main.tf
      - startup.sh=template/startup.sh
      - .terraform.lock.hcl=template/.terraform.lock.hcl
  - name: coder-workspace-ssh
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - authorized_keys=authorized_keys
