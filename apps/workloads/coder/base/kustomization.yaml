---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - postgresql.yaml
  - server.yaml
  - access.yaml
  - workspace.yaml
  - dev-access.yaml
  - dev-portal.yaml
  - backup.yaml
  - bootstrap.yaml
configMapGenerator:
  - name: coder-dev-portal
    namespace: coder
    options:
      disableNameSuffixHash: false
    files:
      - index.html=dev-portal.html
      - dev.css=dev-portal.css
      - dev.js=dev-portal.js
      - display.woff2=dev-fonts/display.woff2
      - display-ext.woff2=dev-fonts/display-ext.woff2
      - text.woff2=dev-fonts/text.woff2
      - text-ext.woff2=dev-fonts/text-ext.woff2
      - dev-proxy.mjs=dev-proxy.mjs
  - name: coder-workspace-gallery
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - server.py=gallery.py
  - name: coder-bootstrap-script
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - bootstrap.py
  - name: coder-lab-template
    namespace: coder
    options:
      disableNameSuffixHash: true
    files:
      - main.tf=template/main.tf
      - startup.sh=template/startup.sh
      - .terraform.lock.hcl=template/.terraform.lock.hcl
  - name: coder-lab-template
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - main.tf=template/main.tf
      - startup.sh=template/startup.sh
      - .terraform.lock.hcl=template/.terraform.lock.hcl
  - name: coder-workspace-ssh
    namespace: coder-workspaces
    options:
      disableNameSuffixHash: true
    files:
      - authorized_keys=authorized_keys
