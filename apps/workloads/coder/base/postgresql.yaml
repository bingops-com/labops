---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-postgresql
  namespace: coder
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  bootstrap:
    initdb:
      database: coder
      owner: coder
      dataChecksums: true
  storage:
    size: 4Gi
    storageClass: local-path
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: coder-postgresql
        serverName: coder-postgresql-g1
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: coder-postgresql
  namespace: coder
spec:
  configuration:
    destinationPath: s3://bingops-cnpg-labprod/coder
    endpointURL: https://4d31056d6b4bf143606ff3ca757e0b8c.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: {name: coder-r2-credentials, key: ACCESS_KEY_ID}
      secretAccessKey: {name: coder-r2-credentials, key: ACCESS_SECRET_KEY}
    wal: {compression: gzip}
    data: {compression: gzip}
  retentionPolicy: 14d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: coder-postgresql-daily
  namespace: coder
spec:
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster: {name: coder-postgresql}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: coder-postgresql
  namespace: coder
spec:
  selector:
    matchLabels: {cnpg.io/cluster: coder-postgresql}
  podMetricsEndpoints:
    - port: metrics
