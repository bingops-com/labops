---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rpg-private
  namespace: coder-workspaces
spec:
  ipAllowList:
    sourceRange:
      - 192.168.10.0/24
      - 100.64.0.0/10
      - 10.240.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rpg-trailing-slash
  namespace: coder-workspaces
spec:
  redirectRegex:
    regex: '^(https?://[^/]+/rpg)$'
    replacement: '${1}/'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rpg-strip-prefix
  namespace: coder-workspaces
spec:
  stripPrefix:
    prefixes: [/rpg]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder-rpg
  namespace: coder-workspaces
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: coder-workspaces-rpg-private@kubernetescrd,coder-workspaces-rpg-trailing-slash@kubernetescrd,coder-workspaces-rpg-strip-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: coder.lab.bingo
      http:
        paths:
          - path: /rpg
            pathType: Prefix
            backend:
              service:
                name: coder-lab-rpg
                port: {name: http-rpg}
  tls:
    - hosts: [coder.lab.bingo]
      secretName: coder-rpg-tls
