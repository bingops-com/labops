---
# Disposable acceptance resource. It never mounts the live home volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-home-restorecheck
  namespace: coder-workspaces
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: restore
          image: rclone/rclone:1.75.1
          command: [/bin/sh, -ec]
          args:
            - rclone copy r2:bingops-cnpg-labprod/coder-workspaces/bingops-lab/current /restore --log-level ERROR; test -f /restore/.lab-initialized; test -s /restore/.ssh/ssh_host_ed25519_key; rclone check r2:bingops-cnpg-labprod/coder-workspaces/bingops-lab/current /restore --one-way --log-level ERROR; echo 'Isolated workspace restore verified'
          env:
            - {name: RCLONE_CONFIG_R2_TYPE, value: s3}
            - {name: RCLONE_CONFIG_R2_PROVIDER, value: Cloudflare}
            - {name: RCLONE_CONFIG_R2_ENDPOINT, value: "https://4d31056d6b4bf143606ff3ca757e0b8c.r2.cloudflarestorage.com"}
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: coder-r2-credentials, key: ACCESS_KEY_ID}}
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: coder-r2-credentials, key: ACCESS_SECRET_KEY}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: scratch, mountPath: /restore}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 20Gi}
        - {name: tmp, emptyDir: {}}
