apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaas-acceptance-controller
  namespace: pz-server
  labels:
    app.kubernetes.io/name: gaas-acceptance-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gaas-acceptance-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gaas-acceptance-controller
    spec:
      serviceAccountName: gaas-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: ghcr.io/bingops-com/pz-server@sha256:ec4055e2550654c0ddfdae6241c08df936922a24e2ba41048c505b799ba29b3f
        args:
        - --namespace
        - pz-server
        - --game-namespace
        - pz-server
        - --apply
        - --interval
        - '5'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
