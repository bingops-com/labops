---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaas-controller
  namespace: gaming
  labels:
    app.kubernetes.io/name: gaas-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gaas-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gaas-controller
    spec:
      serviceAccountName: gaas-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/bingops-com/pz-server@sha256:eebb826453e1d2e6a3b0678a85dcfab911d1a04f2ae1480d0e4da7e5486defb7
          args:
            - --namespace
            - gaming
            - --game-namespace
            - gaming
            - --apply
            - --interval
            - '5'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
