# labprod values for the chart pinned by the slots Argo CD Application.
image:
  repository: ghcr.io/bingops-com/slots
  tag: sha-74ea2b0739177d5af60f2fa8730cb2d0d59621c5
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: slots.lab.bingo
  tlsSecretName: slots-tls

trustProxy: true

database:
  cnpg:
    enabled: true
    instances: 1
    storage:
      size: 2Gi
      storageClass: local-path
    backup:
      enabled: true
      objectStore: slots-postgresql
      serverName: slots-postgresql-g1
      schedule: "0 30 3 * * *"
    podMonitor:
      enabled: true

resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 384Mi
