apiVersion: apps/v1
kind: Deployment
metadata:
  name: cka
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cka
  template:
    metadata:
      labels:
        app: cka
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/bingops-com/cka-web:development
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: cka-account-services
            optional: true
        - configMapRef:
            name: cka-privacy
            optional: true
        env:
        - name: CKA_PUBLIC_ORIGIN
          value: https://cka.lab.bingo
        - name: CKA_OIDC_ISSUER
          value: https://auth.lab.bingo/application/o/cka/
        - name: CKA_OIDC_CLIENT_ID
          value: cka
        - name: CKA_LAB_GROUP
          value: cka-lab-users
        - name: CKA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cka-database
              key: uri
              optional: true
        - name: CKA_CONTROL_ORIGIN
          value: https://cka-controller.cka.svc.cluster.local:8443
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: web-tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/.next/cache
        - name: study-db-ca
          mountPath: /run/cka-db
          readOnly: true
        - name: control-tls
          mountPath: /run/cka-tls
          readOnly: true
      volumes:
      - name: study-db-ca
        secret:
          secretName: cka-database
          optional: true
          items:
          - key: ca.crt
            path: ca.crt
      - name: web-tmp
        emptyDir: {}
      - name: next-cache
        emptyDir: {}
      - name: control-tls
        secret:
          secretName: cka-web-tls
          defaultMode: 288
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cka-privacy-maintenance
  namespace: cka
spec:
  schedule: '17 3 * * *'
  timeZone: Etc/UTC
  # Activate declaratively after the migration, privacy review and first preview.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: maintenance
            image: ghcr.io/bingops-com/cka-web:development
            command: [node, scripts/privacy-maintenance.mjs, --apply]
            env:
            - name: CKA_MAINTENANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cka-database
                  key: uri
            volumeMounts:
            - name: database-ca
              mountPath: /run/cka-db
              readOnly: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
          volumes:
          - name: database-ca
            secret:
              secretName: cka-database
              items:
              - key: ca.crt
                path: ca.crt
