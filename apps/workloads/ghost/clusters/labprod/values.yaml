# labprod values for the chart pinned by the ghost Argo CD Application.
# The image tag and apps/gitops/clusters/labprod/ghost.yaml pin the same
# published commit of bingops-com/ghost (see ../../README.md).
image:
  repository: ghcr.io/bingops-com/ghost
  tag: sha-583eb238c633938180d32a876a062ae9389fd0de
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: ghost.lab.bingo
  tlsSecretName: ghost-tls

trustProxy: true

signupUrl: https://games.lab.bingo

# The common lab.bingo database: CNPG cluster games/arcade-postgresql, database
# arcade. The URI is copied into this namespace by the arcade reconciler.
database:
  existingSecret:
    name: arcade-database
    key: uri

networkPolicy:
  enabled: true
  databaseTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: games
      podSelector:
        matchLabels:
          cnpg.io/cluster: arcade-postgresql

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
