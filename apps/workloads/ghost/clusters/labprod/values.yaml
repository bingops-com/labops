# labprod values for the chart pinned by the ghost Argo CD Application.
# The image tag and apps/gitops/clusters/labprod/ghost.yaml pin the same
# published commit of bingops-com/ghost (see ../../README.md).
image:
  repository: ghcr.io/bingops-com/ghost
  tag: sha-9d8316a03afa891f2bed15a0068b4b479b6db4f1
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: ghost.lab.bingo
  tlsSecretName: ghost-tls

trustProxy: true

# Own database and accounts, like Games and Slots. Shared lab.bingo accounts
# (database.sharedAccounts) follow the arcade cutover: see ../../README.md.
database:
  sharedAccounts: false
  cnpg:
    enabled: true
    instances: 1
    storage:
      size: 1Gi
      storageClass: local-path
    backup:
      enabled: true
      objectStore: ghost-postgresql
      serverName: ghost-postgresql-g1
      schedule: "0 45 3 * * *"
    podMonitor:
      enabled: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
