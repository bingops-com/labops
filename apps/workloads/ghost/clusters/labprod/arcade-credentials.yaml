# Lets the arcade credential reconciler (games/arcade-credentials-sync, declared
# in apps/workloads/arcade/staging/labprod) copy the common database URI into
# ghost/arcade-database. Kubernetes cannot restrict "create" to one name; reads
# and patches are limited to that Secret. Declared here, with the namespace, so
# that the arcade Application never depends on this namespace existing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arcade-credentials-target
  namespace: ghost
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [arcade-database]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arcade-credentials-target
  namespace: ghost
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: arcade-credentials-target}
subjects:
  - {kind: ServiceAccount, name: arcade-credentials-sync, namespace: games}
