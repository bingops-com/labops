---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-gaming-layout
  namespace: portal
data:
  migrate.py: |
    import json,os,tempfile
    from pathlib import Path
    path=Path('/data/layout.json')
    if not path.exists():
        print('PORTAL_GAMING_LAYOUT_JSON='+json.dumps({'source':'default-config','changed':False}))
        raise SystemExit(0)
    if path.is_symlink():raise ValueError('Unexpected layout symlink')
    raw=path.read_bytes();pages=json.loads(raw)
    if not isinstance(pages,list):raise ValueError('Unexpected saved layout')
    page=json.loads(Path('/config/gaming-page.json').read_text())
    widgets=[w for p in pages for c in p.get('columns',[]) for w in c.get('widgets',[])]
    changed=False
    if not any(w.get('type')=='gamerooms' for w in widgets):
        current=next((p for p in pages if p.get('slug')==page['slug']),None)
        if current is None:
            if len(pages)>=20:raise ValueError('Saved layout has no room for gaming page')
            pages.append(page)
        else:
            column=next((c for c in current['columns'] if c.get('size')=='full' and len(c.get('widgets',[]))<40),None)
            if column is None:
                if len(current['columns'])>=4:raise ValueError('Existing page has no room for gaming widget')
                current['columns'].append(page['columns'][0])
            else:column['widgets'].extend(page['columns'][0]['widgets'])
        changed=True
    for w in widgets:
        refs=w.get('options',{}).get('cronjobs')
        if isinstance(refs,list) and 'pz-server/pz-server-pz-server-backup' in refs:
            w['options']['cronjobs']=list(dict.fromkeys('gaming/gaas-state-backup' if ref=='pz-server/pz-server-pz-server-backup' else ref for ref in refs))
            changed=True
        if w.get('type')=='gameserver' and w.get('options',{}).get('address')=='pz-server-pz-server.pz-server.svc.cluster.local:16261':
            w['type']='bookmarks'
            w['options'].pop('address',None)
            w['options']['groups']=[{'links':[{'title':'Piloter le serveur','url':'/serveurs'}]}]
            changed=True
    if changed:
        backup=Path('/data/layout.before-gaming-v1.json')
        if not backup.exists():
            fd=os.open(backup,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
            with os.fdopen(fd,'wb') as out:out.write(raw)
        fd,tmp=tempfile.mkstemp(prefix='.gaming-layout-',dir='/data')
        try:
            with os.fdopen(fd,'w') as out:json.dump(pages,out,ensure_ascii=False,indent=2);out.flush();os.fsync(out.fileno())
            os.chmod(tmp,path.stat().st_mode&0o777)
            if path.read_bytes()!=raw:raise ValueError('Layout changed concurrently; retry without overwriting')
            os.replace(tmp,path)
        finally:
            if os.path.exists(tmp):os.unlink(tmp)
    print('PORTAL_GAMING_LAYOUT_JSON='+json.dumps({'source':'saved-layout','changed':changed,'hasGamingWidget':True}))
---
apiVersion: batch/v1
kind: Job
metadata:
  name: portal-gaming-layout-v1
  namespace: portal
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: python:3.13.7-alpine3.22
          command:
            - python
            - /scripts/migrate.py
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portal-data
        - name: scripts
          configMap:
            name: portal-gaming-layout
        - name: config
          configMap:
            name: portal-gaming
