---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - gaming-layout.yaml
labels:
  - pairs:
      environment: labprod
patches:
  - target:
      kind: Ingress
      name: portal
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: portal.lab.bingo
      - op: replace
        path: /spec/tls/0/hosts/0
        value: portal.lab.bingo
  - target:
      kind: Deployment
      name: portal
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: portal
        namespace: portal
      spec:
        template:
          spec:
            containers:
              - name: portal
                env:
                  - name: PORTAL_CLUSTER_NAME
                    value: labprod
                  # Editing requires an Authentik login; reading stays open.
                  - name: PORTAL_PUBLIC_URL
                    value: https://portal.lab.bingo
                  - name: PORTAL_OIDC_ISSUER
                    value: https://auth.lab.bingo/application/o/portal/
                  - name: PORTAL_OIDC_CLIENT_ID
                    value: portal
                  - name: PORTAL_OIDC_GROUP
                    value: portal-editors
                  # The only private addresses widgets may reach; public
                  # addresses stay open.
                  - name: PORTAL_INTERNAL_HOSTS
                    value: .svc.cluster.local
  - target:
      kind: Deployment
      name: portal
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: portal
        namespace: portal
      spec:
        template:
          spec:
            containers:
            - name: portal
              env:
              - name: PORTAL_GAMES_CONFIG
                value: /etc/gaming/gaming-config.json
              volumeMounts:
              - name: gaming
                mountPath: /etc/gaming
                readOnly: true
            volumes:
            - name: gaming
              configMap:
                name: portal-gaming
configMapGenerator:
  - name: portal-gaming
    namespace: portal
    files:
      - gaming-config.json
      - gaming-page.json
    options:
      disableNameSuffixHash: true
