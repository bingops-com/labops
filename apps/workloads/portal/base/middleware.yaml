# Reading requires LAN or tailnet access. Editing also requires the
# portal-editors Authentik group through the portal's native OIDC login.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portal-allowlist
  namespace: portal
spec:
  ipAllowList:
    sourceRange:
      - 192.168.10.0/24
      - 100.64.0.0/10
