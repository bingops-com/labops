apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - middleware.yaml
  - ingress.yaml

# portal.yaml is the default layout. The portal re-reads the mounted file, so a
# config-only change needs no image release.
configMapGenerator:
  - name: portal-config
    namespace: portal
    files:
      - portal.yaml
    options:
      disableNameSuffixHash: true
