apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      serviceAccountName: portal
      securityContext:
        fsGroup: 65532
      containers:
        - name: portal
          image: ghcr.io/bingops-com/portal:sha-6110a91
          imagePullPolicy: IfNotPresent
          env:
            - name: PORTAL_CONFIG
              value: /etc/portal/portal.yaml
            - name: PORTAL_DATA
              value: /data
            - name: PORTAL_CLUSTER_NAME
              value: cluster
            - name: PORTAL_VAR_PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
            - name: PORTAL_VAR_GATUS_URL
              value: http://gatus.gatus.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/portal
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: portal-config
        - name: data
          persistentVolumeClaim:
            claimName: portal-data
