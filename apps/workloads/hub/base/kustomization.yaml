apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hub
resources:
  - namespace.yaml
  - server.yaml
configMapGenerator:
  - name: hub-config
    files:
      - Caddyfile
  - name: hub-site
    files:
      - site/index.html
      - site/style.css
      - site/app.js
      - site/favicon.svg
  - name: hub-fonts
    files:
      - site/fonts/onest-latin.woff2
      - site/fonts/onest-OFL.txt
      - site/fonts/ibm-plex-sans-latin.woff2
      - site/fonts/ibm-plex-sans-OFL.txt
