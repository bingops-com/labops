# Chart and image commit are pinned together by the Argo CD Application.
production: true
publicUrl: https://games.lab.bingo
trustProxy: true
admin:
  enabled: true
  issuer: https://auth.lab.bingo/application/o/games-admin/
  clientId: games-admin
  username: bingops
  group: games-admins
image:
  repository: ghcr.io/bingops-com/games
  tag: sha-3167e72db9bf1a08c113ba1ee1a1001ab584ebdc
networkPolicy:
  enabled: true
  # Authentik's public issuer is served by Cloudflare. Restrict TCP/443 to
  # https://www.cloudflare.com/ips-v4 (reviewed 2026-10-12); Go also enforces
  # HTTPS, the exact issuer origin and no redirects. No access to other ports.
  adminTo:
    - ipBlock: {cidr: 173.245.48.0/20}
    - ipBlock: {cidr: 103.21.244.0/22}
    - ipBlock: {cidr: 103.22.200.0/22}
    - ipBlock: {cidr: 103.31.4.0/22}
    - ipBlock: {cidr: 141.101.64.0/18}
    - ipBlock: {cidr: 108.162.192.0/18}
    - ipBlock: {cidr: 190.93.240.0/20}
    - ipBlock: {cidr: 188.114.96.0/20}
    - ipBlock: {cidr: 197.234.240.0/22}
    - ipBlock: {cidr: 198.41.128.0/17}
    - ipBlock: {cidr: 162.158.0.0/15}
    - ipBlock: {cidr: 104.16.0.0/13}
    - ipBlock: {cidr: 104.24.0.0/14}
    - ipBlock: {cidr: 172.64.0.0/13}
    - ipBlock: {cidr: 131.0.72.0/22}
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflare
      podSelector:
        matchLabels:
          app.kubernetes.io/name: cloudflare-tunnel
          app.kubernetes.io/instance: bingops
database:
  cnpg:
    enabled: true
    instances: 1
    storage:
      size: 2Gi
      storageClass: local-path
    backup:
      enabled: true
      destinationPath: s3://bingops-cnpg-labprod/games
      endpointURL: https://4d31056d6b4bf143606ff3ca757e0b8c.r2.cloudflarestorage.com
      credentialsSecret: games-r2-credentials
      serverName: games-postgresql-g1
      schedule: "0 30 3 * * *"
      retentionPolicy: 14d
    podMonitor:
      enabled: true
