apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
    spec:
      automountServiceAccountToken: false
      # The romm Service would otherwise inject ROMM_PORT=tcp://...:80,
      # overriding RomM's numeric Nginx listen-port setting.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: initialize-data-directories
          image: rommapp/romm:5.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ["mkdir -p /romm/library/roms /romm/resources /romm/assets /romm/config; chown -R 1000:1000 /romm/library /romm/resources /romm/assets /romm/config"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE"]
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /romm
      containers:
        - name: romm
          image: rommapp/romm:5.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Europe/Paris
            - name: ROMM_DB_DRIVER
              value: postgresql
            - name: DB_HOST
              value: romm-postgresql-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: username
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: password
            # CNPG generates this random password; using it as the signing key
            # avoids introducing another recoverability-sensitive secret.
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: password
            - name: REDIS_HOST
              value: romm-valkey
            - name: ROMM_BASE_URL
              value: https://romm.lab.bingo
            - name: ROMM_SESSION_SECURE_COOKIE
              value: "true"
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: DISABLE_SETUP_WIZARD
              value: "true"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ALLOW_REGISTRATION
              value: "true"
            - name: OIDC_PROVIDER
              value: authentik
            - name: OIDC_CLIENT_ID
              value: romm
            - name: OIDC_REDIRECT_URI
              value: https://romm.lab.bingo/api/oauth/openid
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://auth.lab.bingo/application/o/romm
            - name: OIDC_CLAIM_ROLES
              value: groups
            - name: OIDC_ROLE_ADMIN
              value: romm-admins
            - name: OIDC_ROLE_VIEWER
              value: "*"
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /romm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: romm-data
