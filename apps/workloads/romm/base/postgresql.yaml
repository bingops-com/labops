apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-postgresql
  namespace: romm
spec:
  instances: 1
  bootstrap:
    initdb:
      database: romm
      owner: romm
      dataChecksums: true
  storage:
    size: 8Gi
    storageClass: local-path
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: romm-postgresql
        # Increment this suffix after a fresh initdb so Barman writes to an
        # empty archive while older generations remain available to restore.
        serverName: romm-postgresql-g1
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: romm-postgresql
  namespace: romm
spec:
  configuration:
    destinationPath: s3://bingops-cnpg-labprod/romm
    endpointURL: https://4d31056d6b4bf143606ff3ca757e0b8c.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: romm-cnpg-r2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: romm-cnpg-r2-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: 14d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: romm-postgresql-daily
  namespace: romm
spec:
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  cluster:
    name: romm-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: romm-postgresql
  namespace: romm
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: romm-postgresql
  podMetricsEndpoints:
    - port: metrics
