---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-valkey
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: affine-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --save
            - ''
            - --appendonly
            - 'no'
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: affine-valkey
  namespace: affine
spec:
  selector:
    app.kubernetes.io/name: affine-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
