---
apiVersion: batch/v1
kind: Job
metadata:
  name: affine-initialize
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: python:3.13.7-alpine3.22
          command:
            - python
            - -B
            - /scripts/initialize.py
          env:
            - name: OWNER_EMAIL
              value: therealbingops@gmail.com
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: affine-scripts
