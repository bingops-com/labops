---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - postgresql.yaml
  - valkey.yaml
  - server.yaml
  - initialize.yaml
  - backup.yaml
  - restorecheck.yaml
configMapGenerator:
  - name: affine-config
    namespace: affine
    files:
      - config.json
  - name: affine-scripts
    namespace: affine
    files:
      - initialize.py
      - backup-files.sh
