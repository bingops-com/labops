apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: labops-labprod
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.57.9
    helm:
      releaseName: fluent-bit
      valuesObject:
        env:
          - name: FLUENT_ELASTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: observability-elasticsearch-clients
                key: fluent-bit-password
        config:
          service: |
            [SERVICE]
                Flush                     5
                Daemon                    Off
                Log_Level                 info
                Parsers_File              /fluent-bit/etc/parsers.conf
                Parsers_File              /fluent-bit/etc/conf/custom_parsers.conf
                HTTP_Server               On
                HTTP_Listen               0.0.0.0
                HTTP_Port                 2020
                Health_Check              On
                storage.path              /var/log/flb-storage/
                storage.sync              normal
                storage.checksum          On
                storage.backlog.mem_limit 32M
          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                multiline.parser  docker, cri
                Tag               kube.*
                DB                /var/log/flb-storage/tail-containers.db
                DB.Sync           Normal
                Refresh_Interval  10
                Rotate_Wait       30
                Buffer_Chunk_Size 64KB
                Buffer_Max_Size   1MB
                Mem_Buf_Limit     20MB
                Skip_Long_Lines   On
                storage.type      filesystem
          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Kube_Tag_Prefix     kube.var.log.containers.
                Merge_Log           On
                Keep_Log            Off
                Labels              On
                Annotations         Off
          outputs: |
            [OUTPUT]
                Name                es
                Match               kube.*
                Host                observability-es-http.logging.svc
                Port                9200
                HTTP_User           fluent-bit
                HTTP_Passwd         ${FLUENT_ELASTIC_PASSWORD}
                Logstash_Format     On
                Logstash_Prefix     logs-labprod
                Generate_ID         On
                Suppress_Type_Name  On
                tls                 On
                tls.verify          Off
                Retry_Limit         False
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: node
        extraVolumes:
          - name: fluent-bit-state
            hostPath:
              path: /var/lib/fluent-bit
              type: DirectoryOrCreate
        extraVolumeMounts:
          - name: fluent-bit-state
            mountPath: /var/log/flb-storage
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        tolerations:
          - operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
