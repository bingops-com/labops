apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/labops.git
    targetRevision: master
    path: charts/status
    helm:
      releaseName: status
      valueFiles:
        - ../../apps/workloads/status/clusters/labprod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
