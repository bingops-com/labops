apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mail-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/labops.git
    targetRevision: master
    path: apps/platform/mail/labprod
  destination:
    server: https://kubernetes.default.svc
    namespace: mail
  # Only synchronize after the SMTP/DKIM inputs and certificate are ready.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
