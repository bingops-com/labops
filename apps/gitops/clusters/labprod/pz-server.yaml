apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pz-server-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  sources:
    - repoURL: https://github.com/bingops-com/labops.git
      targetRevision: master
      path: apps/workloads/pz-server/clusters/labprod
    - repoURL: https://github.com/bingops-com/pz-server.git
      targetRevision: master
      path: charts/pz-server
      helm:
        releaseName: pz-server
        valuesObject:
          replicaCount: 0
          backup:
            enabled: false
          service:
            type: ClusterIP
          image:
            digest: sha256:6a8385569f6e6871acae17a4a472b7abdcad3432869da5c09eef0320268d368c
          steam:
            expectedBuildId: "26486687"
  destination:
    server: https://kubernetes.default.svc
    namespace: pz-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
