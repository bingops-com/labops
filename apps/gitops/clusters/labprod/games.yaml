apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  sources:
    - repoURL: https://github.com/bingops-com/games.git
      targetRevision: 33fb5d752b538db203b629483ad9fb8f85d4e444
      path: chart
      helm:
        releaseName: games
        valueFiles:
          - $values/apps/workloads/games/clusters/labprod/values.yaml
    - repoURL: https://github.com/bingops-com/labops.git
      targetRevision: master
      ref: values
      path: apps/workloads/games/clusters/labprod
  destination:
    server: https://kubernetes.default.svc
    namespace: games
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
