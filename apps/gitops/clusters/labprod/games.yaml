apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: games-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  sources:
    - repoURL: https://github.com/bingops-com/games.git
      targetRevision: 3167e72db9bf1a08c113ba1ee1a1001ab584ebdc
      path: chart
      helm:
        releaseName: games
        valueFiles:
          - $values/apps/workloads/games/clusters/labprod/values.yaml
    - repoURL: https://github.com/bingops-com/labops.git
      targetRevision: master
      ref: values
      path: apps/workloads/games/clusters/labprod
  destination:
    server: https://kubernetes.default.svc
    namespace: games
  # Manual until NetworkPolicy enforcement and production acceptance pass.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
