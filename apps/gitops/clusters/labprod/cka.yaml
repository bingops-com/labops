apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/cka.git
    targetRevision: 428d15ccfcc51af42c131c896ea563fae59022a0
    path: deploy
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:428d15ccfcc51af42c131c896ea563fae59022a0
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:428d15ccfcc51af42c131c896ea563fae59022a0
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
