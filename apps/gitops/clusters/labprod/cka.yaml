apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/cka.git
    targetRevision: fcf6e85d9b11a65224f13f45e824e0d99730b602
    path: deploy
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:fcf6e85d9b11a65224f13f45e824e0d99730b602
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:fcf6e85d9b11a65224f13f45e824e0d99730b602
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
