apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/labops.git
    targetRevision: master
    path: apps/workloads/cka/labprod
    kustomize:
      # Temporary web write freeze for the canonical account migration.
      replicas:
        - name: cka
          count: 0
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:b00ba5e6c78ae9b563ad2675248d65ec13a3dd6a
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:b00ba5e6c78ae9b563ad2675248d65ec13a3dd6a
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
