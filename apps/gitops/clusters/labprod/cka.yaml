apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/cka.git
    targetRevision: c96f19ad5b1fb1b068e7faf6bc32d472cd4c7039
    path: deploy
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:14b8b16e95d0b3b211fe6606eacad25691c3d316
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:14b8b16e95d0b3b211fe6606eacad25691c3d316
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
