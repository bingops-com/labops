apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/cka.git
    targetRevision: ba1cf93255ac401625ec0f4d77e0bd0b19d84220
    path: deploy
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:ba1cf93255ac401625ec0f4d77e0bd0b19d84220
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:ba1cf93255ac401625ec0f4d77e0bd0b19d84220
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
