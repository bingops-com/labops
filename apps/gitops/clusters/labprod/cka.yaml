apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/cka.git
    targetRevision: 646c613a7fe395b3864b15ab9a748560fce8417b
    path: deploy
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:646c613a7fe395b3864b15ab9a748560fce8417b
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:646c613a7fe395b3864b15ab9a748560fce8417b
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
