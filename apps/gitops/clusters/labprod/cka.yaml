apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/cka.git
    targetRevision: 2c7569ae3d9d6313218023e105bf3c7eb55d7008
    path: deploy
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:2c7569ae3d9d6313218023e105bf3c7eb55d7008
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:2c7569ae3d9d6313218023e105bf3c7eb55d7008
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
