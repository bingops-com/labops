apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cka-labprod
  namespace: argocd-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: labops-labprod
  source:
    repoURL: https://github.com/bingops-com/labops.git
    targetRevision: master
    path: apps/workloads/cka/labprod
    kustomize:
      images:
        - ghcr.io/bingops-com/cka-web=ghcr.io/bingops-com/cka-web:bee14b131cf7080f85194ebebdb5737c34ae08d2
        - ghcr.io/bingops-com/cka-controller=ghcr.io/bingops-com/cka-controller:bee14b131cf7080f85194ebebdb5737c34ae08d2
  destination:
    server: https://kubernetes.default.svc
    namespace: cka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
