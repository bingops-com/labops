apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-settings
  namespace: mail
data:
  POSTFIX_myhostname: smtp.games.lab.bingo
  ALLOWED_SENDER_DOMAINS: games.lab.bingo smtp.games.lab.bingo
  DKIM_SELECTOR: games1
  # Do not set DKIM_AUTOGENERATE: even the nonempty string "false" enables it.
  ANONYMIZE_EMAILS: paranoid
  POSTFIX_mynetworks: 127.0.0.1/32 [::1]/128
  POSTFIX_smtpd_tls_security_level: encrypt
  POSTFIX_smtpd_tls_cert_file: /etc/postfix/tls/tls.crt
  POSTFIX_smtpd_tls_key_file: /etc/postfix/tls/tls.key
  POSTFIX_smtpd_tls_mandatory_protocols: '>=TLSv1.2'
  POSTFIX_smtpd_tls_auth_only: "yes"
  POSTFIX_smtpd_sasl_security_options: noanonymous
  POSTFIX_smtpd_relay_restrictions: permit_sasl_authenticated,reject
  POSTFIX_smtpd_sender_restrictions: reject_non_fqdn_sender,check_sender_access lmdb:/etc/postfix/allowed_senders,reject
  POSTFIX_smtpd_client_connection_count_limit: "10"
  POSTFIX_message_size_limit: "1048576"
  # Direct delivery uses opportunistic TLS; some recipients do not offer TLS.
  POSTFIX_smtp_tls_security_level: may
  POSTFIX_milter_default_action: tempfail
  POSTFIX_maximal_queue_lifetime: 1h
  POSTFIX_bounce_queue_lifetime: 1h
