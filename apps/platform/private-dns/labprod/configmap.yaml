apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-private
  namespace: private-dns
data:
  Corefile: |
    argocd.lab.bingo:53 {
        errors
        log
        reload 10s
        bind 192.168.10.160
        template IN A {
            match ^argocd[.]lab[.]bingo[.]$
            answer "{{ .Name }} 30 IN A 192.168.10.151"
        }
        cache 30
    }
    grafana.lab.bingo:53 {
        errors
        log
        reload 10s
        bind 192.168.10.160
        template IN A {
            match ^grafana[.]lab[.]bingo[.]$
            answer "{{ .Name }} 30 IN A 192.168.10.151"
        }
        cache 30
    }
    lab.bingo:53 {
        errors
        log
        reload 10s
        bind 192.168.10.160
        template IN A {
            match ^lab[.]bingo[.]$
            answer "{{ .Name }} 30 IN A 192.168.10.151"
        }
        template IN AAAA {
            match ^lab[.]bingo[.]$
            rcode NOERROR
        }
        forward . 1.1.1.1 9.9.9.9
        cache 30
    }
