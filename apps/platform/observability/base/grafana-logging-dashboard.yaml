apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-labops-logging
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  labops-logging.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "min(up{namespace=\"logging\",service=\"fluent-bit\"})", "instant": true, "legendFormat": "Fluent Bit", "range": false, "refId": "A"}],
          "title": "Fluent Bit scrape health",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "sum(rate(fluentbit_input_records_total{name=~\"tail\\\\..*\"}[$__rate_interval]))", "instant": false, "legendFormat": "records/s", "range": true, "refId": "A"}],
          "title": "Logs collected / second",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "sum(increase(fluentbit_output_errors_total{name=~\"es\\\\..*\"}[1h])) or vector(0)", "instant": true, "legendFormat": "errors", "range": false, "refId": "A"}],
          "title": "Output errors (1h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "sum(increase(fluentbit_output_dropped_records_total{name=~\"es\\\\..*\"}[1h])) + sum(increase(fluentbit_output_retries_failed_total{name=~\"es\\\\..*\"}[1h])) or vector(0)", "instant": true, "legendFormat": "lost", "range": false, "refId": "A"}],
          "title": "Lost records (1h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "sum(rate(fluentbit_input_records_total{name=~\"tail\\\\..*\"}[$__rate_interval]))", "legendFormat": "collected", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "sum(rate(fluentbit_output_proc_records_total{name=~\"es\\\\..*\"}[$__rate_interval]))", "legendFormat": "indexed", "range": true, "refId": "B"}
          ],
          "title": "Log pipeline throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"axisCenteredZero": true, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "bars", "fillOpacity": 20, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "normal"}, "thresholdsStyle": {"mode": "off"}}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "options": {"legend": {"calcs": ["sum"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "sum(rate(fluentbit_output_errors_total{name=~\"es\\\\..*\"}[$__rate_interval]))", "legendFormat": "errors/s", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "sum(rate(fluentbit_output_retries_total{name=~\"es\\\\..*\"}[$__rate_interval]))", "legendFormat": "retries/s", "range": true, "refId": "B"},
            {"editorMode": "code", "expr": "sum(rate(fluentbit_output_dropped_records_total{name=~\"es\\\\..*\"}[$__rate_interval]))", "legendFormat": "dropped/s", "range": true, "refId": "C"}
          ],
          "title": "Elasticsearch delivery anomalies",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "elasticsearch", "uid": "elasticsearch"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 12},
          "id": 7,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"bucketAggs": [{"field": "@timestamp", "id": "2", "settings": {"interval": "auto"}, "type": "date_histogram"}], "datasource": {"type": "elasticsearch", "uid": "elasticsearch"}, "metrics": [{"id": "1", "type": "logs"}], "query": "stream:\"stderr\" OR level:(error OR fatal OR critical)", "refId": "A", "timeField": "@timestamp"}],
          "title": "Errors and stderr",
          "type": "logs"
        },
        {
          "datasource": {"type": "elasticsearch", "uid": "elasticsearch"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 12},
          "id": 8,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"bucketAggs": [{"field": "@timestamp", "id": "2", "settings": {"interval": "auto"}, "type": "date_histogram"}], "datasource": {"type": "elasticsearch", "uid": "elasticsearch"}, "metrics": [{"id": "1", "type": "logs"}], "query": "*", "refId": "A", "timeField": "@timestamp"}],
          "title": "Recent cluster logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["labops", "logging", "fluent-bit", "elasticsearch"],
      "templating": {"list": []},
      "time": {"from": "now-3h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "LabOps / Logging",
      "uid": "labops-logging",
      "version": 1,
      "weekStart": ""
    }
