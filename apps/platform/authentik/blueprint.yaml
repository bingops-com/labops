  romm.yaml: |
    version: 1
    metadata:
      name: labops-romm
    entries:
      # Keep RomM independent from the branding blueprint. A legacy duplicate
      # auth.lab.bingo Brand must not prevent the SSO provider from reconciling.
      - model: authentik_core.group
        identifiers:
          name: romm-admins
        attrs:
          is_superuser: false
          users:
            - !Find [authentik_core.user, [username, bingops]]
      - model: authentik_core.group
        id: rom-admins
        identifiers:
          name: rom-admins
        attrs:
          is_superuser: false
          users:
            - !Find [authentik_core.user, [username, bingops]]
      - model: authentik_providers_oauth2.scopemapping
        id: romm-email-scope
        identifiers:
          name: RomM verified email
        attrs:
          scope_name: email
          description: Email claim required by RomM with Authentik 2025.10+
          expression: |
            return {
                "email": request.user.email,
                "email_verified": True,
            }
      - model: authentik_providers_oauth2.scopemapping
        id: romm-groups-scope
        identifiers:
          name: RomM group membership
        attrs:
          scope_name: groups
          description: Authentik group names used by RomM role mapping
          expression: |
            return {
                "groups": [group.name for group in request.user.all_groups()],
            }
      - model: authentik_providers_oauth2.oauth2provider
        id: romm-provider
        identifiers:
          name: RomM production
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: romm
          grant_types:
            - authorization_code
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !KeyOf romm-email-scope
            - !KeyOf romm-groups-scope
          redirect_uris:
            - matching_mode: strict
              url: https://rom.lab.bingo/api/oauth/openid
      - model: authentik_core.application
        identifiers:
          slug: romm
        attrs:
          name: RomM production
          provider: !KeyOf romm-provider
          meta_launch_url: https://rom.lab.bingo
      # ROMarr itself remains cluster-internal. This proxy publishes only the
      # request portal, whose backend allowlists search and grab operations.
      - model: authentik_policies_expression.expressionpolicy
        id: rom-request-authenticated-users
        identifiers:
          name: ROM requests authenticated users
        attrs:
          expression: |
            return request.user.is_authenticated
      - model: authentik_providers_proxy.proxyprovider
        id: rom-request-proxy-provider
        identifiers:
          name: ROM requests production
        attrs:
          mode: proxy
          external_host: https://rom-requests.lab.bingo
          internal_host: http://rom-request-portal.rom.svc.cluster.local:8080
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        id: rom-request-application
        identifiers:
          slug: rom-requests
        attrs:
          name: ROM requests
          provider: !KeyOf rom-request-proxy-provider
          meta_launch_url: https://rom-requests.lab.bingo
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf rom-request-application
          policy: !KeyOf rom-request-authenticated-users
          order: 0
        attrs:
          target: !KeyOf rom-request-application
          policy: !KeyOf rom-request-authenticated-users
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          name: authentik Embedded Outpost
          type: proxy
          providers:
            - !KeyOf rom-request-proxy-provider
      # Keep cleanup entries for the former full-access ROMarr proxy.
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: romarr
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: ROMarr production
