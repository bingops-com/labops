# Scrapes the CloudNativePG exporter of the Authentik database: size,
# connections and WAL archiving age, shown by the portal's PostgreSQL widget.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-labprod-postgresql
  namespace: authentik
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-labprod-postgresql
  podMetricsEndpoints:
    - port: metrics
