PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers dev
ClientAliveInterval 30
ClientAliveCountMax 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
SetEnv PATH=/opt/dev-vm/mise/shims:/opt/dev-vm/venv/bin:/usr/lib/postgresql/18/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
SetEnv MISE_DATA_DIR=/opt/dev-vm/mise LANG=C.UTF-8 LC_CTYPE=C.UTF-8 DISABLE_AUTOUPDATER=1 CHROMIUM=/usr/bin/chromium ANSIBLE_COLLECTIONS_PATH=/home/dev/.ansible/collections:/opt/dev-vm/venv/collections CLUSTERCTL_DISABLE_VERSIONCHECK=true
