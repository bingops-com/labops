#!/usr/sbin/nft -f
# Replacing only this table preserves the rules owned by tailscaled.
destroy table inet dev_vm
table inet dev_vm {
  chain input {
    type filter hook input priority 10; policy drop;
    # Check these before established flows, including subnet-router traffic.
    iifname != "tailscale0" iifname != "lo" tcp dport { 22, 53, 443 } drop
    iifname "lo" accept
    ct state established,related accept
    iifname "tailscale0" tcp dport { 22, 53, 443 } accept
    iifname "tailscale0" udp dport 53 accept
    udp dport 41641 accept
    ip protocol icmp accept
    meta l4proto ipv6-icmp accept
  }
}
