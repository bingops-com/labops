name: Games release

on:
  pull_request:
    branches: [master]
    paths:
      - apps/gitops/clusters/labprod/games.yaml
      - apps/workloads/games/**
      - .github/workflows/games-release.yml
  push:
    branches: [master]
    paths:
      - apps/gitops/clusters/labprod/games.yaml
      - apps/workloads/games/**
      - .github/workflows/games-release.yml

permissions:
  contents: read

jobs:
  release:
    name: Published Games release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test the release gate
        run: python3 -m unittest discover -s apps/workloads/games/tests -p test_release.py
      - name: Require matching pins, merged commit and public image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 apps/workloads/games/tests/check_release.py
