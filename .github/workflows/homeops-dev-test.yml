---
name: HomeOps development environment acceptance

'on':
  pull_request:
    branches: [master]
    paths:
      - docker/homeops-dev/**
      - hacks/provision-homeops-dev.py
      - hacks/tests/test_homeops_dev.py
      - apps/workloads/coder/base/template/**
      - .github/scripts/test-coder-workspace.sh
      - .github/workflows/homeops-dev-test.yml
  push:
    branches: [master]
    paths:
      - docker/homeops-dev/**
      - hacks/provision-homeops-dev.py
      - hacks/tests/test_homeops_dev.py
      - apps/workloads/coder/base/template/**
      - .github/scripts/test-coder-workspace.sh
      - .github/workflows/homeops-dev-test.yml

permissions:
  contents: read

jobs:
  homeops-tools-and-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the pinned development environment
        run: docker buildx build --load --tag labops-homeops-dev:test docker/homeops-dev
      - name: Verify fake credential rotation with the real runtime clients and YAML parser
        run: docker run --rm --env PYTHONDONTWRITEBYTECODE=1 --mount "type=bind,src=${{ github.workspace }},dst=/tmp/repo,readonly" --workdir /tmp/repo labops-homeops-dev:test python3 -m unittest discover -s hacks/tests -p test_homeops_dev.py
      - name: Verify iSH-compatible SSH and HomeOps tools as UID 1000
        run: bash .github/scripts/test-coder-workspace.sh labops-homeops-dev:test homeops
