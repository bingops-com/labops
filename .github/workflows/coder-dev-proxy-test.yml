---
name: Coder development aliases
'on':
  pull_request:
    branches: [master]
    paths:
      - apps/workloads/coder/base/dev-proxy.mjs
      - apps/workloads/coder/base/dev-portal.*
      - apps/workloads/coder/base/dev-fonts/**
      - hacks/tests/test_coder_dev_ui.mjs
      - hacks/tests/test_coder_dev_proxy.mjs
      - .github/workflows/coder-dev-proxy-test.yml
  push:
    branches: [master]
    paths:
      - apps/workloads/coder/base/dev-proxy.mjs
      - apps/workloads/coder/base/dev-portal.*
      - apps/workloads/coder/base/dev-fonts/**
      - hacks/tests/test_coder_dev_ui.mjs
      - hacks/tests/test_coder_dev_proxy.mjs
      - .github/workflows/coder-dev-proxy-test.yml
permissions:
  contents: read
jobs:
  proxy:
    name: Authenticated development aliases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test hacks/tests/test_coder_dev_proxy.mjs
      - name: Dashboard browser acceptance
        run: node hacks/tests/test_coder_dev_ui.mjs
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
