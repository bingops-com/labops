name: Repository validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  scripts:
    name: Shell and workflow linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: find .github/scripts hacks -type f -name '*.sh' -print0 | sort -z | xargs -0 shellcheck
      - name: Download actionlint
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          ACTIONLINT_VERSION: 1.7.7
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --pattern "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" actionlint
      - name: Run actionlint
        run: ./actionlint
      - name: Check coherent home backups with the declared rclone release
        run: |
          rclone_image=$(python3 -c 'import pathlib,re; print(re.search(r"image: (rclone/rclone:\S+)", pathlib.Path("apps/workloads/coder/base/backup.yaml").read_text())[1])')
          tool_dir=$(mktemp -d)
          container_id=$(docker create "$rclone_image")
          trap 'docker rm "$container_id" >/dev/null; rm -rf "$tool_dir"' EXIT
          docker cp "$container_id:/usr/local/bin/rclone" "$tool_dir/rclone"
          PATH="$tool_dir:$PATH" python3 -m unittest discover -s apps/workloads/coder/tests -p test_home_backup.py -v
          PATH="$tool_dir:$PATH" python3 -m unittest discover -s apps/workloads/affine/tests -v
          shellcheck apps/workloads/affine/base/backup-files.sh
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --read-only --network none \
            --entrypoint /bin/sh -e RCLONE_CONFIG=/dev/null \
            --mount "type=bind,src=$PWD/apps/workloads/coder/base/prune-archives.sh,dst=/scripts/prune-archives.sh,readonly" \
            --tmpfs /tmp:uid=1000,gid=1000,mode=0700 "$rclone_image" -ec '
              mkdir -p /tmp/fixture/archive/2000-01-01T00-00-00Z /tmp/fixture/archive/2100-01-01T00-00-00Z /tmp/fixture/archive/unknown
              echo TEST_ONLY_OLD > /tmp/fixture/archive/2000-01-01T00-00-00Z/file
              echo TEST_ONLY_RECENT > /tmp/fixture/archive/2100-01-01T00-00-00Z/file
              echo TEST_ONLY_UNKNOWN > /tmp/fixture/archive/unknown/file
              /bin/sh /scripts/prune-archives.sh /tmp/fixture/archive
              test ! -e /tmp/fixture/archive/2000-01-01T00-00-00Z
              test -s /tmp/fixture/archive/2100-01-01T00-00-00Z/file
              test -s /tmp/fixture/archive/unknown/file
            '
          python_image=$(python3 -c 'import pathlib,re; print(re.search(r"image: (docker\.io/python:\S+)", pathlib.Path("apps/workloads/coder/base/backup.yaml").read_text())[1])')
          FIXTURE_DIR="$tool_dir/home" python3 - <<'PY'
          import os, pathlib, sqlite3
          home = pathlib.Path(os.environ["FIXTURE_DIR"])
          (home / ".codex").mkdir(parents=True)
          home.chmod(0o777)
          (home / ".codex").chmod(0o777)
          (home / ".lab-initialized").touch()
          connection = sqlite3.connect(home / ".codex/state_5.sqlite")
          connection.execute("PRAGMA journal_mode=WAL")
          connection.execute("CREATE TABLE fixture(value INTEGER)")
          connection.execute("INSERT INTO fixture VALUES (1)")
          connection.commit()
          connection.close()
          PY
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --read-only --network none \
            --mount "type=bind,src=$tool_dir/home,dst=/data" \
            --mount "type=bind,src=$PWD/apps/workloads/coder/base/snapshot-codex.py,dst=/scripts/snapshot-codex.py,readonly" \
            --tmpfs /snapshots:uid=1000,gid=1000,mode=0700 "$python_image" \
            /bin/sh -ec 'python3 -B /scripts/snapshot-codex.py; python3 -c "import sqlite3; c=sqlite3.connect(\"/snapshots/.codex/state_5.sqlite\"); assert c.execute(\"SELECT count(*) FROM fixture\").fetchone()==(1,)"'

  kustomize:
    name: Render Kustomize overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4
      - run: bash .github/scripts/validate-kustomize.sh
      - name: Check public directory and private portal isolation
        run: python3 -m unittest discover -s apps/workloads/hub/tests -v
      - name: Validate the static server with its pinned image
        run: |
          caddy_image=$(python3 -c 'import pathlib,re; print(re.search(r"image: (caddy:\S+)", pathlib.Path("apps/workloads/hub/base/server.yaml").read_text())[1])')
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --read-only --network none \
            --mount "type=bind,src=$PWD/apps/workloads/hub/base/Caddyfile,dst=/etc/caddy/Caddyfile,readonly" \
            --tmpfs /tmp:uid=1000,gid=1000,mode=0700,size=128m,exec \
            --entrypoint /bin/sh "$caddy_image" -ec '
              cp /usr/bin/caddy /tmp/caddy
              /tmp/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            '

  renovate:
    name: Validate Renovate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx --yes --package renovate@43.272.8 renovate-config-validator renovate.json
