---
name: Standalone development VM acceptance
'on':
  pull_request:
    branches: [master]
    paths:
      - terraform/dev-vm/**
      - environments/dev-vm/**
      - ansible/dev-vm.yml
      - ansible/roles/dev_vm/**
      - hacks/*dev*.py
      - hacks/tests/test_dev_vm.py
      - hacks/retire-coder.py
      - hacks/tests/test_retire_coder.py
      - renovate.json
      - .github/workflows/dev-vm-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test-only tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y restic
          python -m pip install ansible-core==2.19.2
      - name: Verify real encrypted backup and isolated SQLite restoration
        run: python -m unittest discover -s hacks/tests -p test_dev_vm.py -v
      - name: Reject incomplete Coder retirement evidence
        run: python -m unittest discover -s hacks/tests -p test_retire_coder.py -v
      - name: Check Ansible syntax without contacting a host
        run: ansible-playbook -i 'dev,' ansible/dev-vm.yml --syntax-check
      - name: Check health helper syntax
        run: bash -n ansible/roles/dev_vm/files/health.sh
      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=terraform/dev-vm fmt -check
      - run: terraform -chdir=terraform/dev-vm init -backend=false -input=false
      - run: terraform -chdir=terraform/dev-vm validate
