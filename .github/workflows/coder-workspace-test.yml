---
name: Coder workspace acceptance

'on':
  pull_request:
    branches: [master]
    paths:
      - docker/coder-workspace/**
      - apps/workloads/coder/base/template/startup.sh
      - .github/scripts/test-coder-workspace.sh
      - .github/workflows/coder-workspace-test.yml
  push:
    branches: [master]
    paths:
      - docker/coder-workspace/**
      - apps/workloads/coder/base/template/startup.sh
      - .github/scripts/test-coder-workspace.sh
      - .github/workflows/coder-workspace-test.yml

permissions:
  contents: read

jobs:
  native-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build workspace candidate
        run: docker buildx build --load --tag labops-coder-workspace:test docker/coder-workspace
      - name: Verify SSH and tools without privileges
        run: bash .github/scripts/test-coder-workspace.sh labops-coder-workspace:test
